name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"

  # The HA Marketplace (2026.11+) still requires hacs.json; hacs/action is the only validator for it.
  # shortcut: no Marketplace-specific validator exists yet, swap this job when Home Assistant ships one.
  hacs: # https://github.com/hacs/action
    name: "Marketplace (hacs.json) Validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands" # Remove this 'ignore' key when you have added brand images for your integration to https://github.com/home-assistant/brands
